<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CortexAI</title>
    <link rel="icon" type="image/png" href="assets/logo-sidebar.png">
    <link rel="stylesheet" href="styles.css">
    <!-- Local libraries for faster loading -->
    <link rel="stylesheet" href="libs/highlight.css">
    <script src="libs/highlight.js" defer></script>
    <script src="libs/python.js" defer></script>
    <script src="libs/marked.js" defer></script>
    <script>
        // Initialize theme from localStorage before page renders
        (function() {
            const savedTheme = localStorage.getItem('cortexai-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <img class="brand-logo" src="assets/logo-sidebar.png" alt="CortexAI Logo">
                    <div class="brand-text">
                        <span class="brand-title">CortexAI</span>
                    </div>
                </div>
                <button class="new-chat-icon-btn" id="newChatBtn" title="新建对话">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
            <div class="sidebar-section history-section">
                <div class="history-header">
                    <h3>历史记录</h3>
                    <button class="history-clear-btn" id="historyClearBtn" title="清空历史记录">
                        <svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" width="16" height="16">
                            <path d="M740.266667 869.546667H256a62.72 62.72 0 0 1-51.2-23.466667 59.52 59.52 0 0 1-4.693333-66.773333A564.906667 564.906667 0 0 0 274.133333 554.666667l64 3.626666a610.986667 610.986667 0 0 1-67.626666 225.706667 14.933333 14.933333 0 0 0 13.44 21.333333h442.666666a14.506667 14.506667 0 0 0 14.293334-11.093333 512 512 0 0 0-14.293334-237.226667l62.72-17.066666c36.48 130.773333 26.026667 250.666667 7.04 293.973333a59.733333 59.733333 0 0 1-56.106666 35.626667z" fill="currentColor"></path>
                            <path d="M384 869.546667a31.146667 31.146667 0 0 1-21.333333-8.533334 31.786667 31.786667 0 0 1-1.706667-45.226666A192 192 0 0 0 414.08 704a32.213333 32.213333 0 0 1 32-31.573333c17.493333 0 31.786667 14.08 32 31.573333a253.013333 253.013333 0 0 1-71.04 155.306667 32 32 0 0 1-23.04 10.24zM571.093333 869.546667a32 32 0 0 1-23.466666-53.76A192 192 0 0 0 601.6 704a32.213333 32.213333 0 0 1 32-31.573333c17.493333 0 31.786667 14.08 32 31.573333a253.013333 253.013333 0 0 1-71.04 155.306667 32 32 0 0 1-23.466667 10.24zM827.306667 496l-55.68-114.986667a80.64 80.64 0 0 0-72.96-45.866666H605.866667V202.666667A53.333333 53.333333 0 0 0 552.533333 149.333333h-49.92a53.76 53.76 0 0 0-53.546666 53.333334v132.48H356.266667a81.066667 81.066667 0 0 0-72.96 45.866666l-57.173334 118.4a53.12 53.12 0 0 0 7.253334 57.813334A56.746667 56.746667 0 0 0 277.333333 576h503.68a53.333333 53.333333 0 0 0 48.426667-31.146667 57.813333 57.813333 0 0 0-2.133333-48.853333z m-77.013334 16H304.853333a8.533333 8.533333 0 0 1-7.68-12.373333L341.333333 408.746667a17.066667 17.066667 0 0 1 15.36-9.6h103.68a53.12 53.12 0 0 0 53.12-53.12v-128c0-2.346667 1.92-4.266667 4.266667-4.266667h20.266667c2.346667 0 4.266667 1.92 4.266666 4.266667v128a53.333333 53.333333 0 0 0 53.333334 53.12h103.466666a17.706667 17.706667 0 0 1 15.573334 9.6l43.733333 90.88a8.533333 8.533333 0 0 1-8.106667 12.373333z" fill="currentColor"></path>
                        </svg>
                    </button>
                </div>
                <div class="history-list" id="historyList">
                    <!-- History will be populated here -->
                </div>
                <div class="history-footer">
                    <label class="auto-approve-toggle">
                        <input type="checkbox" id="autoApproveToggle" checked>
                        <span>自动批准</span>
                    </label>
                    <div class="connection-status" id="connectionStatus">
                        <span class="status-dot"></span>
                        <span class="status-text">未连接</span>
                    </div>
                </div>
                <div class="login-panel compact" id="loginPanel">
                    <div class="login-header">
                        <span class="login-title">登录</span>
                        <span class="login-user" id="loginUser">未登录</span>
                    </div>
                    <form class="login-form" id="loginForm">
                        <div class="login-row">
                            <input id="loginUsername" name="username" list="loginUsers" autocomplete="username" placeholder="账号" required>
                            <datalist id="loginUsers">
                                <option value="xh1"></option>
                                <option value="xh2"></option>
                                <option value="xh3"></option>
                                <option value="xh4"></option>
                            </datalist>
                            <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="密码" required>
                            <button class="btn btn-primary login-btn" id="loginBtn" type="submit">登录</button>
                        </div>
                    </form>
                    <button class="btn btn-secondary logout-btn" id="logoutBtn" type="button">退出</button>
                    <div class="login-status" id="loginStatus"></div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="chat-header">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <img class="header-logo" src="assets/logo-sidebar.png" alt="CortexAI Logo">
                <h2 id="chatTitle">新对话</h2>
                <div class="header-actions">
                    <!-- Theme Toggle Button -->
                    <button class="theme-toggle" id="themeToggle" title="切换主题">
                        <!-- Sun icon (shown in light mode) -->
                        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        <!-- Moon icon (shown in dark mode) -->
                        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Chat Messages -->
            <div class="chat-container" id="chatContainer">
                <div class="welcome-message" id="welcomeMessage">
                    <div class="welcome-logo">
                        <img src="assets/logo-main.png" alt="CortexAI">
                    </div>
                    <h2>您好，我是CortexAI</h2>
                    <p>智能助理，随时为您服务</p>
                </div>
                <div class="messages" id="messages">
                    <!-- Messages will be populated here -->
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <!-- Task Drawer -->
                <div class="task-drawer" id="taskDrawer">
                    <div class="task-drawer-header" id="taskDrawerHeader">
                        <div class="task-drawer-title">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M9 11l3 3L22 4"></path>
                                <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                            </svg>
                            <span>任务进度</span>
                            <span class="task-drawer-badge" id="taskDrawerBadge"></span>
                        </div>
                        <svg class="task-drawer-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="18 15 12 9 6 15"></polyline>
                        </svg>
                    </div>
                    <div class="task-drawer-content" id="taskDrawerContent">
                        <!-- Task items will be populated here -->
                    </div>
                </div>
                <!-- Attachment Preview Area (above input) -->
                <div class="attachment-preview-wrapper" id="attachmentPreviewWrapper">
                    <div class="attachment-preview" id="attachmentPreview" aria-live="polite"></div>
                    <button class="attachment-scroll-btn attachment-scroll-right" id="attachmentScrollRight" type="button" aria-label="滚动查看更多">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
                <div class="input-wrapper">
                    <input
                        id="attachInput"
                        class="attach-input"
                        type="file"
                        multiple
                        accept="image/*,.txt,.md,.markdown,.csv,.tsv,.json,.jsonl,.yaml,.yml,.log,.pdf,.docx,.xlsx,.xls"
                    >
                    <textarea
                        id="userInput"
                        placeholder="请输入消息，Enter发送，Ctrl+Enter换行"
                        rows="1"
                    ></textarea>
                    <div class="input-toolbar">
                        <div class="toolbar-left">
                            <button class="toolbar-btn attach-btn" id="attachBtn" title="上传附件" type="button" aria-label="上传附件">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </button>

                        </div>
                        <div class="toolbar-right">
                            <button class="send-btn" id="sendBtn" disabled>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <line x1="12" y1="19" x2="12" y2="5"></line>
                                    <polyline points="5 12 12 5 19 12"></polyline>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Right Sidebar for Tool Details -->
        <aside class="tool-detail-sidebar" id="toolDetailSidebar">
            <div class="tool-detail-header">
                <h3 id="toolDetailTitle">工具详情</h3>
                <button class="tool-detail-close" id="toolDetailClose" title="关闭">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="tool-detail-content" id="toolDetailContent">
                <!-- Tool details will be populated here -->
            </div>
        </aside>
    </div>

    <!-- Interrupt Modal -->
    <div class="modal" id="interruptModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>操作需要批准</h3>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body" id="interruptModalBody">
                <!-- Interrupt details will be populated here -->
            </div>
            <div class="modal-footer" id="interruptModalFooter">
                <!-- Action buttons will be populated here -->
            </div>
        </div>
    </div>

    <!-- Browser Intervention Modal -->
    <div class="modal" id="interventionModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>需要手动操作浏览器</h3>
            </div>
            <div class="modal-body" id="interventionModalBody">
                <!-- Intervention details will be populated here -->
            </div>
            <div class="modal-footer" id="interventionModalFooter">
                <!-- Action buttons will be populated here -->
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal" id="deleteConfirmModal">
        <div class="modal-content modal-sm">
            <div class="modal-header">
                <h3>确认删除</h3>
                <button class="close-btn" id="closeDeleteModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <p class="confirm-text">确定要删除这条对话记录吗？此操作无法撤销。</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="cancelDeleteBtn">取消</button>
                <button class="btn btn-danger" id="confirmDeleteBtn">删除</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
