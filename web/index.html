<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepAgents - 智能体框架</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Local libraries for faster loading -->
    <link rel="stylesheet" href="libs/highlight.css">
    <script src="libs/highlight.js" defer></script>
    <script src="libs/python.js" defer></script>
    <script src="libs/marked.js" defer></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>DeepAgents</h1>
                <button class="new-chat-btn" id="newChatBtn" title="新对话">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    新对话
                </button>
            </div>
            <div class="sidebar-section">
                <h3>会话</h3>
                <div class="session-list" id="sessionList">
                    <!-- Sessions will be populated here -->
                </div>
            </div>
            <div class="sidebar-section">
                <h3>历史</h3>
                <div class="history-list" id="historyList">
                    <!-- History will be populated here -->
                </div>
            </div>
            <div class="sidebar-footer">
                <label class="auto-approve-toggle">
                    <input type="checkbox" id="autoApproveToggle" checked>
                    <span>自动批准</span>
                </label>
                <div class="connection-status" id="connectionStatus">
                    <span class="status-dot"></span>
                    <span class="status-text">未连接</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="chat-header">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <h2 id="chatTitle">新对话</h2>
                <div class="header-actions">
                    <button class="icon-btn" id="cancelBtn" title="取消当前任务" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Chat Messages -->
            <div class="chat-container" id="chatContainer">
                <div class="welcome-message" id="welcomeMessage">
                    <h2>欢迎使用 DeepAgents</h2>
                    <p>基于 LangGraph 的开源智能体框架</p>
                </div>
                <div class="messages" id="messages">
                    <!-- Messages will be populated here -->
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea
                        id="userInput"
                        placeholder="给 DeepAgents 发送消息…（Cmd+Enter 发送）"
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="input-footer">
                    <span class="hint">按 Cmd+Enter 发送</span>
                </div>
            </div>
        </main>
    </div>

    <!-- Interrupt Modal -->
    <div class="modal" id="interruptModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>操作需要批准</h3>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body" id="interruptModalBody">
                <!-- Interrupt details will be populated here -->
            </div>
            <div class="modal-footer" id="interruptModalFooter">
                <!-- Action buttons will be populated here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
