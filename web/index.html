<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星火智能</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="styles.css">
    <!-- Local libraries for faster loading -->
    <link rel="stylesheet" href="libs/highlight.css">
    <script src="libs/highlight.js" defer></script>
    <script src="libs/python.js" defer></script>
    <script src="libs/marked.js" defer></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <img class="brand-logo" src="logo.png" alt="星火智能体 Logo">
                    <div class="brand-text">
                        <span class="brand-title">星火之言</span>
                    </div>
                </div>
            </div>
            <div class="sidebar-section history-section">
                <h3>历史</h3>
                <div class="history-list" id="historyList">
                    <!-- History will be populated here -->
                </div>
                <div class="history-footer">
                    <label class="auto-approve-toggle">
                        <input type="checkbox" id="autoApproveToggle" checked>
                        <span>自动批准</span>
                    </label>
                    <div class="connection-status" id="connectionStatus">
                        <span class="status-dot"></span>
                        <span class="status-text">未连接</span>
                    </div>
                </div>
                <div class="login-panel" id="loginPanel">
                    <div class="login-header">
                        <span class="login-title">登录</span>
                        <span class="login-user" id="loginUser">未登录</span>
                    </div>
                    <form class="login-form" id="loginForm">
                        <label for="loginUsername">账号</label>
                        <input id="loginUsername" name="username" list="loginUsers" autocomplete="username" placeholder="xh1" required>
                        <datalist id="loginUsers">
                            <option value="xh1"></option>
                            <option value="xh2"></option>
                            <option value="xh3"></option>
                            <option value="xh4"></option>
                        </datalist>
                        <label for="loginPassword">密码</label>
                        <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="••••" required>
                        <button class="btn btn-primary login-btn" id="loginBtn" type="submit">登录</button>
                    </form>
                    <button class="btn btn-secondary logout-btn" id="logoutBtn" type="button">退出登录</button>
                    <div class="login-status" id="loginStatus"></div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="chat-header">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <img class="header-logo" src="logo.png" alt="星火智能体 Logo">
                <h2 id="chatTitle">新对话</h2>
                <div class="header-actions">
                    <button class="icon-btn new-chat-icon-btn" id="newChatBtn" title="新对话">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15a4 4 0 0 1-4 4H8l-5 4V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"></path>
                            <line x1="12" y1="9" x2="12" y2="15"></line>
                            <line x1="9" y1="12" x2="15" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Chat Messages -->
            <div class="chat-container" id="chatContainer">
                <div class="welcome-message" id="welcomeMessage">
                    <h2>欢迎使用</h2>
                    <p>星火自研的智能体框架</p>
                </div>
                <div class="messages" id="messages">
                    <!-- Messages will be populated here -->
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
	                    <textarea
	                        id="userInput"
	                        placeholder="输入消息…（Cmd+Enter 发送，Esc 中断）"
	                        rows="1"
	                    ></textarea>
                    <button class="send-btn" id="sendBtn" disabled>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
	                </div>
	                <div class="input-footer">
	                    <span class="hint">Cmd+Enter 发送，Esc 中断</span>
	                </div>
	            </div>
	        </main>
	    </div>

    <!-- Interrupt Modal -->
    <div class="modal" id="interruptModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>操作需要批准</h3>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body" id="interruptModalBody">
                <!-- Interrupt details will be populated here -->
            </div>
            <div class="modal-footer" id="interruptModalFooter">
                <!-- Action buttons will be populated here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
